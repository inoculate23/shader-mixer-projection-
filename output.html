<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQUAAWKE · Clean projection</title><style>html,body{margin:0;background:#000;width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;object-fit:contain}p{position:absolute;color:#aaa;font:14px sans-serif}canvas:fullscreen{background:#000}</style><canvas id="mirror"></canvas><p id="hint">Waiting for instrument · double click for fullscreen</p><script>
const canvas=document.getElementById('mirror'),ctx=canvas.getContext('2d'),hint=document.getElementById('hint');function draw(){try{const source=opener&&!opener.closed?opener.document.getElementById('output'):null;if(source){if(canvas.width!==source.width||canvas.height!==source.height){canvas.width=source.width;canvas.height=source.height;}ctx.drawImage(source,0,0);hint.hidden=true;}else{hint.hidden=false;hint.textContent='Instrument closed. Reopen output from the controller.';}}catch{hint.hidden=false;hint.textContent='Open this output from the same-origin instrument.';}requestAnimationFrame(draw);}draw();canvas.ondblclick=()=>canvas.requestFullscreen?.().catch(()=>{});
</script></html>
