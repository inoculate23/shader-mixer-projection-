<!doctype html><html lang="en"><meta charset="utf-8"><title>SQUAAWKE · Projection output</title><style>html,body{margin:0;background:black;width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;object-fit:contain}p{position:absolute;color:#aaa;font:14px sans-serif}canvas:fullscreen{background:#000}</style><canvas id="output"></canvas><p id="hint">Waiting for instrument · double click for fullscreen</p><script type="module">
import {Renderer} from './src/renderer.js';const c=document.getElementById('output');let r;try{r=new Renderer(c);}catch(e){document.getElementById('hint').textContent=e.message;}addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==opener||e.data.type!=='squaawke-frame')return;if(r){r.render(e.data.state,e.data.time,e.data.levels);document.getElementById('hint').hidden=true;}});c.ondblclick=()=>c.requestFullscreen?.().catch(()=>{});
</script></html>
